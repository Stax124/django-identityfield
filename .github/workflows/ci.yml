name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint (${{ matrix.toxenv }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toxenv: [ruff, ty]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Run ${{ matrix.toxenv }}
        run: uvx --with tox-uv tox run -e ${{ matrix.toxenv }}

  test:
    name: test (Python ${{ matrix.python }}, Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toxenv: py313-django52, python: "3.13", django: "5.2" }
          - { toxenv: py313-django60, python: "3.13", django: "6.0" }
          - { toxenv: py314-django52, python: "3.14", django: "5.2" }
          - { toxenv: py314-django60, python: "3.14", django: "6.0" }
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      # The suite spins up a Postgres container via testcontainers; the runner
      # ships Docker, so only the image pull needs warming up.
      - name: Pull the Postgres image
        run: docker pull postgres:18-alpine

      - name: Run ${{ matrix.toxenv }}
        run: uvx --with tox-uv tox run -e ${{ matrix.toxenv }}
